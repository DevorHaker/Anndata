name: SmartProcure CD Staging & Production Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-staging:
    name: Staging Deployment & Automated Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Tag Container Images
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:staging ./backend
          docker build -t ghcr.io/${{ github.repository }}/frontend:staging ./frontend
          docker push ghcr.io/${{ github.repository }}/backend:staging
          docker push ghcr.io/${{ github.repository }}/frontend:staging

  deploy-production:
    name: Production Deployment (Manual Approval Gate)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v3

      - name: Deploy Immutable Release Artifact to Production
        run: |
          echo "🚀 Executing rolling zero-downtime container deployment to Production Cluster..."
          echo "Release Tag: ${{ github.ref_name }}"
